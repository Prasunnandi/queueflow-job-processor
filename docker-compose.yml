version: '3.8'

services:
  queueflow-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - NODE_ENV=production
    restart: always

  queueflow-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3007:80"
    depends_on:
      - queueflow-backend
    restart: always
